name: Deploy GEB Empresarial

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-geb-empresarial
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Pre-deploy SEO audit
        env:
          SITE_DIR: "site"
        run: |
          python3 - <<'PY'
          import os, pathlib, json, re, sys, xml.etree.ElementTree as ET
          root=pathlib.Path(os.environ["SITE_DIR"])
          errors=[]
          files={name:root/name for name in ("index.html","404.html","mapa-do-site/index.html","robots.txt","sitemap.xml")}
          for name,p in files.items():
              if not p.is_file() or not p.stat().st_size: errors.append("Missing or empty: "+str(p))
          if files["index.html"].is_file():
              html=files["index.html"].read_text(encoding="utf-8").lower()
              for token in ('lang="pt-br"','<title','name="description"','rel="canonical"'):
                  if token not in html: errors.append("Home missing "+token)
              if re.search(r'<meta[^>]+name="robots"[^>]+noindex',html): errors.append("Home blocked by noindex")
              for blob in re.findall(r'<script[^>]+type="application/ld\+json"[^>]*>(.*?)</script>',html,re.S):
                  try: json.loads(blob)
                  except ValueError: errors.append("Invalid JSON-LD")
          for slug in ("solucoes","apoio-empresarial","parceiros","palestras"):
              page_path=root/slug/"index.html"
              if not page_path.is_file(): errors.append("Missing commercial page: "+str(page_path))
              else:
                  page_html=page_path.read_text(encoding="utf-8").lower()
                  if "<h1" not in page_html: errors.append("Missing H1: "+str(page_path))
                  if f"https://gebempresarial.grupoeduardabispo.com.br/{slug}/" not in page_html: errors.append("Missing canonical: "+str(page_path))
          js=root/"assets/js/main.js"
          if not js.is_file() or "/apoio-empresarial/" not in js.read_text(encoding="utf-8") or "/parceiros/" not in js.read_text(encoding="utf-8"):
              errors.append("Main navigation must include Apoio Empresarial and Parceiros")
          if files["robots.txt"].is_file():
              robots=files["robots.txt"].read_text(encoding="utf-8")
              if not re.search(r'^Sitemap:\s*https://',robots,re.I|re.M): errors.append("robots.txt needs sitemap declaration")
              if re.search(r'^Disallow:\s*/\s*$',robots,re.I|re.M): errors.append("robots.txt blocks all")
          if files["sitemap.xml"].is_file():
              try:
                  tree=ET.parse(files["sitemap.xml"])
                  locs=[(e.text or "").strip() for e in tree.iter() if e.tag.rsplit("}",1)[-1]=="loc"]
                  if not locs or len(locs)!=len(set(locs)) or any(not u.startswith("https://") for u in locs): errors.append("Invalid, empty or duplicated sitemap URLs")
              except ET.ParseError: errors.append("Malformed sitemap XML")
          if files["404.html"].is_file() and "noindex" not in files["404.html"].read_text(encoding="utf-8").lower(): errors.append("404 page missing noindex")
          for error in errors: print("::error::"+error)
          if errors: sys.exit(1)
          print("Pre-deploy SEO checks passed")
          PY
      - name: Smoke test LP Programa Anual 2027 (ciclos e WhatsApp)
        run: |
          node --check site/assets/js/programa-anual.js
          node tests/programa-anual.test.cjs

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Test FTP connection
        env:
          FTP_HOST: ${{ secrets.HOST }}
          FTP_USER: ${{ secrets.USER }}
          FTP_PASS: ${{ secrets.PASS }}
        run: |
          lftp -e "set ftp:passive-mode true; set ftp:ssl-allow no; ls; bye" -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"

      - name: Deploy site
        env:
          FTP_HOST: ${{ secrets.HOST }}
          FTP_USER: ${{ secrets.USER }}
          FTP_PASS: ${{ secrets.PASS }}
        run: |
          lftp -e "set ftp:passive-mode true; set ftp:ssl-allow no; mirror --reverse --delete --verbose ./site/ ./public_html/gebempresarial/; bye" -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
